name: Verify production

on:
  workflow_dispatch:
    inputs:
      rerun_arkham:
        description: Run Arkham evidence sync before verification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-production:
    name: Verify production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Arkham evidence sync
        id: arkham
        if: inputs.rerun_arkham
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "content-type: application/json" \
            --data '{}' \
            "${SUPABASE_URL%/}/functions/v1/sync-arkham-evidence" \
            --output arkham-sync-result.json
          jq '.' arkham-sync-result.json
          jq --exit-status '.ok == true and .status == "success"' arkham-sync-result.json

      - name: Check Arkham persistence
        if: inputs.rerun_arkham
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command \
            "select last_run_status, last_run_completed_at, last_success_at from public.arkham_provider_control where id = true;"
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command \
            "select searched_alias, entity_id, discovery_status, evidence_status, eligible_for_ranking from public.arkham_entity_mappings order by searched_alias;"
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --command \
            "select count(*) as evidence_rows, count(*) filter (where eligible_for_ranking) as ranking_eligible_rows from public.arkham_evidence;"

      - name: Verify production HTTP contracts
        id: http
        continue-on-error: true
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: pnpm smoke:production

      - name: Verify production database
        id: database
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm verify:production-database

      - name: Report final result
        if: always()
        run: |
          echo "## Overall result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP verification: ${{ steps.http.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database verification: ${{ steps.database.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.http.outcome }}" != "success" || "${{ steps.database.outcome }}" != "success" ]]; then
            echo "Production verification failed. Review the safe check summaries above and configure missing production environment secrets manually." >&2
            exit 1
          fi
